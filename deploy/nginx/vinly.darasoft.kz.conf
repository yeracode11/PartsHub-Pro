# Лендинг Vinly Business: https://vinly.darasoft.kz -> контейнер autohub-landing (127.0.0.1:3010).
# Установка и выпуск сертификата: deploy/nginx/README.md.

upstream vinly_landing {
    server 127.0.0.1:3010;
    keepalive 16;
}

# HTTP: проверка домена Let's Encrypt и редирект на HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name vinly.darasoft.kz;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vinly.darasoft.kz;

    ssl_certificate     /etc/letsencrypt/live/vinly.darasoft.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vinly.darasoft.kz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:vinly_ssl:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Форма отправляет JSON на /api/lead, тела большого размера не нужны.
    client_max_body_size 1m;

    location / {
        proxy_pass http://vinly_landing;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
